appId: host.exp.exponent
name: "Paciente - chatbot con aviso médico visible"
tags:
  - paciente
  - chatbot
  - smoke
---
- runFlow: ../../subflows/preparar.yaml
- runFlow:
    file: ../../subflows/iniciar-sesion-rapido.yaml
    env:
      ROL: paciente
      NAV: nav-inicio
- runFlow: ../../subflows/preguntar-chatbot.yaml
# Los índices de los mensajes pueden variar (saludo inicial, etc.): se usan expresiones regulares
- extendedWaitUntil:
    visible:
      id: 'chat-mensaje-asistente-.*'
    timeout: 15000
- assertVisible:
    id: 'chat-aviso-medico'
- assertNotVisible:
    id: 'chat-escribiendo'
- scrollUntilVisible:
    element:
      id: 'chat-mensaje-usuario-.*'
    direction: UP
    timeout: 10000
- assertVisible:
    id: 'chat-mensaje-usuario-.*'
- takeScreenshot: .maestro/screenshots/a05-chatbot
- runFlow: ../../subflows/cerrar-sesion.yaml