appId: host.exp.exponent
name: "Solicitud de registro de paciente - validaciones sin enviar"
tags:
  - registro
  - paciente
---
- runFlow: ../../subflows/preparar.yaml
- tapOn:
    id: 'login-solicitar-registro'
- extendedWaitUntil:
    visible:
      id: 'registro-paciente-form'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'registro-paciente-enviar'
- tapOn:
    id: 'registro-paciente-enviar'
# Con el formulario vacío no se envía nada: se muestran los errores de los campos
- assertNotVisible:
    id: 'registro-paciente-exito'
# El mensaje está al final del formulario, bajo los campos: se desplaza hasta verlo antes de comprobarlo
- scrollUntilVisible:
    element:
      id: 'registro-paciente-error'
    timeout: 15000
- assertVisible:
    id: 'registro-paciente-error'
    text: 'Revisa los campos marcados en rojo.'
- takeScreenshot: .maestro/screenshots/a13-registro-paciente-errores
- scrollUntilVisible:
    element:
      text: 'Volver a Iniciar sesión'
- tapOn:
    text: 'Volver a Iniciar sesión'
- extendedWaitUntil:
    visible:
      id: 'login-correo'
    timeout: 10000
