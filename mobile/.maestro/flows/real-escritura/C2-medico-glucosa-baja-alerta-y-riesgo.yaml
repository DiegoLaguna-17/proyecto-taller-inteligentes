appId: host.exp.exponent
name: "Suite C - médico registra glucosa baja con alerta y riesgo"
tags:
  - escritura-real
  - medico
  - alerta
  - ml
---
# SUITE C: ESCRIBE en la base real de desarrollo (ADR-0013). Solo con ejecutar-suite.ps1 -Suite C -ConfirmoEscrituras.
# Variables (-e, nunca versionadas): EXPO_URL, MEDICO_CORREO, MEDICO_CLAVE, PACIENTE_CORREO, PACIENTE_CLAVE, E2E_PACIENTE_ID (y opcional E2E_PACIENTE_NOMBRE_REGEX).
- runFlow: ../../subflows/preparar.yaml
- runFlow:
    file: ../../subflows/iniciar-sesion.yaml
    env:
      CORREO: ${MEDICO_CORREO}
      CLAVE: ${MEDICO_CLAVE}
      NAV: nav-pacientes
- runFlow: ../../subflows/abrir-paciente-de-prueba.yaml
# 57 mg/dL en ayunas: hipoglucemia -> la lectura se guarda, se crea la alerta (y el backend envía el correo al médico asignado)
- runFlow:
    file: ../../subflows/registrar-toma-medico.yaml
    env:
      VALOR: '57'
- assertVisible:
    id: 'medico-toma-resultado-mensaje'
    text: '.*Se creó la alerta.*'
- runFlow:
    when:
      visible:
        id: 'ml-riesgo-valor'
    commands:
      - assertVisible:
          id: 'ml-riesgo-valor'
          text: '[0-9]{1,3},[0-9] %'
- takeScreenshot: .maestro/screenshots/c2-medico-glucosa-baja
- tapOn:
    id: 'medico-toma-resultado-confirmar'
- runFlow: ../../subflows/volver-a-pestanas.yaml
# La alerta creada aparece en la pestaña Alertas del médico asignado (57 mg/dL)
- tapOn:
    id: 'nav-alertas'
- extendedWaitUntil:
    visible:
      id: 'alertas-pestana-activas'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '.*57.*'
    timeout: 20000
- assertVisible:
    text: '.*57.*'
- takeScreenshot: .maestro/screenshots/c2-alerta-creada
- runFlow: ../../subflows/cerrar-sesion.yaml
